name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r notification-bridge/requirements.lock -r renpho-scale/requirements.lock
      - run: python -m unittest discover -s notification-bridge -p 'test_*.py'
      - run: python -m unittest discover -s renpho-scale -p 'test_*.py'
      - run: python -m unittest discover -s dashboard -p 'test_*.py'
      - run: python -m unittest discover -s pi-diagnostics -p 'test_*.py'
      - run: node --test dashboard/test_ui.cjs
